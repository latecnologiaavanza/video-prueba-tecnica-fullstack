name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Backend tests and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: inventory-api/pom.xml
      - run: mvn -B clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-api-jar
          path: inventory-api/target/inventory-api-1.0.0-SNAPSHOT.jar

  docker:
    name: Backend Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml config
      - run: docker build -f inventory-api/Dockerfile -t inventory-api:${{ github.sha }} inventory-api
